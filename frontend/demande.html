<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Déposer une demande — OPA</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    :root { --gold:#c39b2e; --gold2:#e6c75f; --ink:#1c1a15; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(160deg,#f7f4ec,#ece6d8); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px; color: #25221b; }
    .card { background:#fff; border:1px solid #e2dccb; border-radius:18px;
      max-width:620px; width:100%; padding:34px;
      box-shadow:0 14px 50px rgba(40,33,12,0.18); }
    .head { text-align:center; margin-bottom:24px; }
    .head img { width:74px; height:74px; object-fit:contain; }
    .head h1 { font-size:22px; color:var(--gold); margin-top:8px; }
    .head p { color:#908875; font-size:13px; margin-top:4px; }
    label { display:block; font-size:13px; font-weight:600; color:#5f594b; margin:14px 0 6px; }
    input, textarea, select { width:100%; padding:11px 13px; border:1px solid #d4cbb2;
      border-radius:10px; font-size:14px; font-family:inherit; background:#faf7f0; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(195,155,46,0.15); background:#fff; }
    textarea { resize:vertical; min-height:90px; }
    .row { display:flex; gap:14px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:200px; }
    button { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px;
      background:linear-gradient(135deg,#e6c75f,#c39b2e,#9a7b22); color:#fff;
      font-size:15px; font-weight:700; cursor:pointer; }
    button:hover { opacity:0.92; }
    button:disabled { opacity:0.6; cursor:default; }
    .msg { margin-top:16px; padding:12px; border-radius:10px; font-size:14px; display:none; }
    .msg.ok { background:#e3f3ea; color:#257a48; display:block; }
    .msg.err { background:#fbe9e8; color:#b53a36; display:block; }
    .hint { font-size:12px; color:#908875; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="assets/logo.png" alt="OPA" />
      <h1>Déposer une demande</h1>
      <p>Organisation des Patronats d'Algérie</p>
    </div>
    <form id="demForm">
      <div class="row">
        <div><label>Nom *</label><input name="nom" required /></div>
        <div><label>Prénom *</label><input name="prenom" required /></div>
      </div>
      <div class="row">
        <div>
          <label>Wilaya *</label>
          <select name="wilaya_code" id="wilayaSel" required>
            <option value="">— Sélectionner —</option>
          </select>
        </div>
        <div>
          <label>Type de demande *</label>
          <select name="type_demande" id="typeSel" required>
            <option value="">— Sélectionner —</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div><label>Email</label><input type="email" name="email" placeholder="vous@exemple.dz" /></div>
        <div><label>Téléphone</label><input name="telephone" placeholder="05XXXXXXXX" /></div>
      </div>
      <label>Matricule d'adhérent (si vous en avez un)</label>
      <input name="matricule" placeholder="AGN19-16-001-AD-2026" />
      <label>Objet de la demande *</label>
      <input name="objet" required placeholder="Ex : Demande de certificat d'adhésion" />
      <label>Priorité</label>
      <select name="priorite">
        <option>Basse</option><option selected>Normale</option><option>Haute</option><option>Urgente</option>
      </select>
      <label>Description</label>
      <textarea name="description" placeholder="Détaillez votre demande…"></textarea>
      <label>Pièces jointes (jusqu'à 5 fichiers)</label>
      <input type="file" name="pieces" multiple />
      <span class="hint">Formats acceptés : PDF, images, documents. Max 15 Mo par fichier.</span>
      <button type="submit" id="submitBtn">Envoyer la demande</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    const API_BASE = '';
    const form = document.getElementById('demForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const wilayaSel = document.getElementById('wilayaSel');
    const typeSel = document.getElementById('typeSel');

    // Charge les référentiels publics (wilayas + types de demande)
    (async () => {
      try {
        const ref = await (await fetch(API_BASE + '/api/reference/public')).json();
        for (const w of ref.wilayas) {
          const o = document.createElement('option');
          o.value = w.code;
          o.textContent = w.code + ' — ' + w.nom + (w.nomAr ? '  (' + w.nomAr + ')' : '');
          wilayaSel.appendChild(o);
        }
        for (const t of ref.typesDemande) {
          const o = document.createElement('option');
          o.value = t; o.textContent = t;
          typeSel.appendChild(o);
        }
      } catch (e) {
        console.warn('Impossible de charger les référentiels.', e);
      }
    })();

    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = true; btn.textContent = 'Envoi en cours…';
      try {
        const res = await fetch(API_BASE + '/api/demandes/public', { method:'POST', body:new FormData(form) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur');
        msg.className = 'msg ok';
        msg.textContent = '✅ Votre demande ' + data.numero + ' a bien été enregistrée. Elle est en attente de traitement.';
        form.reset();
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = '⚠️ ' + err.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Envoyer la demande';
      }
    };
  </script>
</body>
</html>
